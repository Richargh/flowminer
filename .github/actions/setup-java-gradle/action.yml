name: Setup Java and Gradle
description: Setup Java 21, Gradle with caching, and just

runs:
  using: composite
  steps:
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/trunk' }}

    - name: Install just
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y just
