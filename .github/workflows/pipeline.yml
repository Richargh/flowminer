name: Delivery Pipeline

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build project
        run: just build

      - name: Build fmsh distribution
        run: just dist-fmsh

      - name: Build visualization distribution
        run: just dist-viz

      - name: Verify dist artifacts exist
        run: |
          ls -la analysis/fmsh/build/distributions/fmsh*.tar
          ls -la visualization/visualization-*.tar.gz

      - name: Upload Gradle build outputs for test-analysis
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build
          path: |
            shared/build
            analysis/**/build
          retention-days: 1

      - name: Upload KMP-JS dist for test-viz
        uses: actions/upload-artifact@v4
        with:
          name: kmp-js-dist
          path: |
            shared/build/dist/js/productionLibrary
            analysis/git-importer/build/dist/js/productionLibrary
          retention-days: 1

      - name: Upload dist artifacts for release
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            analysis/fmsh/build/distributions/fmsh*.tar
            visualization/visualization-*.tar.gz
          retention-days: 1

      - name: Upload visualization dist for Pages
        uses: actions/upload-artifact@v4
        with:
          name: viz-dist
          path: visualization/dist
          retention-days: 1

  test-analysis:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Gradle build outputs
        uses: actions/download-artifact@v4
        with:
          name: gradle-build
          path: .

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Verify Chrome is installed for KMP Karma tests
        run: google-chrome --version

      - name: Run analysis tests
        run: just test-analysis-ci

  test-viz:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download KMP-JS dist
        uses: actions/download-artifact@v4
        with:
          name: kmp-js-dist
          path: .

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run visualization tests
        run: just test-viz

  deploy-pages:
    needs: [test-analysis, test-viz]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download visualization dist
        uses: actions/download-artifact@v4
        with:
          name: viz-dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [test-analysis, test-viz]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: artifacts

      - name: List artifact contents
        run: find artifacts -type f

      - name: Extract changelogs from distributions
        run: |
          mkdir -p changelogs
          tar -xf artifacts/analysis/fmsh/build/distributions/fmsh*.tar --wildcards '*/CHANGELOG.md' -O > changelogs/analysis.md
          tar -xzf artifacts/visualization/visualization-*.tar.gz CHANGELOG.md -O > changelogs/visualization.md

      - name: Create release notes
        run: |
          cat > release-notes.md << 'EOF'
          # Analysis
          EOF
          cat changelogs/analysis.md >> release-notes.md
          echo -e "\n---\n" >> release-notes.md
          echo "# Visualization" >> release-notes.md
          cat changelogs/visualization.md >> release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --notes-file release-notes.md \
            artifacts/analysis/fmsh/build/distributions/fmsh*.tar \
            artifacts/visualization/visualization-*.tar.gz
