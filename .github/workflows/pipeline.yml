name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build project
        run: just build

      - name: Build fmsh distribution
        run: just dist-fmsh

      - name: Build visualization distribution
        run: just dist-viz

      - name: Verify dist artifacts exist
        run: |
          ls -la analysis/fmsh/build/distributions/fmsh*.tar
          ls -la visualization/visualization-*.tar.gz

      - name: Upload Gradle build outputs for test-analysis
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build
          path: |
            shared/build
            analysis/**/build
          retention-days: 1

      - name: Upload KMP-JS dist for test-viz
        uses: actions/upload-artifact@v4
        with:
          name: kmp-js-dist
          path: |
            shared/build/dist/js/productionLibrary
            analysis/git-importer/build/dist/js/productionLibrary
          retention-days: 1

      - name: Upload dist artifacts for release
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            analysis/fmsh/build/distributions/fmsh*.tar
            visualization/visualization-*.tar.gz
          retention-days: 7

      - name: Upload visualization dist for Pages
        uses: actions/upload-artifact@v4
        with:
          name: viz-dist
          path: visualization/dist
          retention-days: 7

  test-analysis:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Gradle build outputs
        uses: actions/download-artifact@v4
        with:
          name: gradle-build
          path: .

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Verify Chrome is installed for KMP Karma tests
        run: google-chrome --version

      - name: Run analysis tests
        run: just test-analysis-ci

  test-viz:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download KMP-JS dist
        uses: actions/download-artifact@v4
        with:
          name: kmp-js-dist
          path: .

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run visualization tests
        run: just test-viz

  trigger-release:
    needs: [test-analysis, test-viz]
    runs-on: ubuntu-latest
    steps:
      - name: Check for release tag and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if any v* tag points to this commit
          TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[] | select(.commit.sha == "${{ github.sha }}") | .name' | grep '^v' | head -1)

          if [[ -n "$TAG" ]]; then
            echo "Found release tag: $TAG"
            echo "Triggering release workflow..."
            gh workflow run release.yml \
              --repo ${{ github.repository }} \
              -f tag="$TAG" \
              -f run-id="${{ github.run_id }}"
          else
            echo "No release tag found for commit ${{ github.sha }}, skipping release"
          fi
