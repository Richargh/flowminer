<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Visualization</title>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/app.ts"></script>
  </head>
  <body>
    <div class="container mx-auto p-4">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Git Visualization</h1>
        <div class="flex items-center gap-4">
          <file-loader></file-loader>
          <theme-switcher></theme-switcher>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card bg-base-100 shadow-xl lg:col-span-2">
          <div class="card-body">
            <h2 class="card-title">Commit Range</h2>
            <commit-range-panel id="activity-panel"></commit-range-panel>
          </div>
        </div>

        <div class="card bg-base-100 shadow-xl lg:col-span-2">
          <div class="card-body">
            <h2 class="card-title">Work Item Duration</h2>
            <work-item-scatter-panel id="scatter-panel"></work-item-scatter-panel>
          </div>
        </div>

        <div class="card bg-base-100 shadow-xl lg:col-span-2">
          <div class="card-body">
            <h2 class="card-title">Work Item Duration Distribution</h2>
            <work-item-duration-panel id="histogram-panel"></work-item-duration-panel>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
